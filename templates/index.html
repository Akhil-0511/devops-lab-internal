<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f4f8;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            width: 75%;
            margin: auto;
            border-radius: 12px;
        }

        h1 {
            color: #2455a4;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            background: #2455a4;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }

        th {
            background: #2455a4;
            color: white;
        }

        a {
            color: red;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <h3>Add New Student</h3>

    <form action="/add" method="POST">
        <input type="text" name="name"
               placeholder="Student Name" required>

        <input type="text" name="roll"
               placeholder="Roll Number" required>

        <button type="submit">Add Student</button>
    </form>

    <h3>Student Records</h3>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Action</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>
                <a href="/delete/{{ student[0] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
